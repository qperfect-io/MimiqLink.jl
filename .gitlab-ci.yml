stages:
  - register

variables:
  JULIA_PKG_USE_CLI_GIT: "true"

default:
  image: julia:1

register:
  stage: register
  # Only the `-private` tag registers into the internal GitLab registry;
  # the bare `vX.Y.Z` public tag is registered into QPerfectRegistry by
  # the GitHub Actions workflow on the public remote.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-private$/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.qperfect.io/".insteadOf "git@gitlab.qperfect.io:"
    - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.qperfect.io/".insteadOf "https://gitlab.qperfect.io/"
    - git config --global user.email "technical@qperfect.io"
    - git config --global user.name "QPerfect"
    - julia -e 'import Pkg; Pkg.update()'
    - julia -e "import Pkg; Pkg.Registry.add(Pkg.RegistrySpec(url=\"https://${REGISTRY_TOKEN_NAME}:${REGISTRY_TOKEN}@gitlab.qperfect.io/julia/Registry.git\"))"
  script:
    - |
      julia --color=yes -e '
        import Pkg
        Pkg.add("LocalRegistry")
        Pkg.develop(path="./")
        using LocalRegistry
        register("MimiqLink"; registry="QPerfectInternalRegistry",
                 repo="git@gitlab.qperfect.io:development/mimiq/MimiqLink.jl.git",
                 push=true)
      '
